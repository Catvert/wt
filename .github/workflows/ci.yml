name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A build that warns is a build that will warn on everyone else's machine.
  RUSTFLAGS: -D warnings
  CACHIX_CACHE: catvert

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # Builds the package the way Nix users get it, and pushes the result to the binary
  # cache so nobody has to compile it again.
  nix:
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    # The cache is optional: the workflow must stay green before it exists, and on pull
    # requests from forks, which have no access to secrets.
    env:
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: cachix/cachix-action@v15
        if: env.HAS_CACHIX == 'true'
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - run: nix build .#default --print-build-logs
      - run: ./result/bin/wt --version
      # Realising the dev shell pushes the toolchain too, so `nix develop` is instant.
      - run: nix develop --command true
